<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shopping Cart - Smart Car Parking</title>

    <!-- MAIN CSS -->
    <link rel="stylesheet" href="css/style.css">

    <style>
        /* =====================================================
           CART PAGE
           ===================================================== */
        
        .cart-page {
            padding: 25px;
        }
        
        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        
        .cart-header h1 {
            margin: 0;
            font-size: 30px;
        }
        
        .cart-header p {
            margin: 6px 0 0;
            color: #777;
        }
        /* CONTINUE BUTTON */
        
        .continue-btn {
            display: inline-block;
            text-decoration: none;
            background: #111;
            color: white;
            padding: 11px 18px;
            border-radius: 8px;
            font-weight: 600;
            transition: 0.2s;
        }
        
        .continue-btn:hover {
            background: #333;
        }
        /* =====================================================
           CART CONTAINER
           ===================================================== */
        
        .cart-container {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 25px;
            align-items: start;
        }
        /* =====================================================
           CART ITEMS
           ===================================================== */
        
        .cart-items {
            background: white;
            border: 1px solid #e5e5e5;
            border-radius: 14px;
            padding: 20px;
        }
        
        #cartLoading {
            text-align: center;
            padding: 30px;
            color: #777;
        }
        /* =====================================================
           CART ITEM
           ===================================================== */
        
        .cart-item {
            display: flex;
            align-items: center;
            gap: 18px;
            padding: 18px 0;
            border-bottom: 1px solid #eee;
        }
        
        .cart-item:last-child {
            border-bottom: none;
        }
        /* =====================================================
           PRODUCT IMAGE
           ===================================================== */
        
        .cart-item-image {
            width: 120px;
            height: 110px;
            object-fit: cover;
            border-radius: 10px;
            background: #f5f5f5;
            border: 1px solid #eee;
            flex-shrink: 0;
        }
        /* =====================================================
           CART DETAILS
           ===================================================== */
        
        .cart-item-details {
            flex: 1;
        }
        
        .cart-item-details h3 {
            margin: 0 0 7px;
            font-size: 18px;
            color: #222;
        }
        
        .cart-category {
            color: #777;
            font-size: 13px;
            margin-bottom: 8px;
        }
        
        .cart-price {
            font-size: 17px;
            font-weight: 700;
            color: #111;
            margin-bottom: 10px;
        }
        /* =====================================================
           QUANTITY
           ===================================================== */
        
        .quantity-control {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .quantity-control button {
            width: 32px;
            height: 32px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 6px;
            font-size: 18px;
            cursor: pointer;
        }
        
        .quantity-control button:hover {
            background: #f3f3f3;
        }
        
        .quantity-control span {
            min-width: 25px;
            text-align: center;
            font-weight: 600;
        }
        /* =====================================================
           REMOVE BUTTON
           ===================================================== */
        
        .remove-btn {
            border: none;
            background: #dc2626;
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            margin-top: 8px;
        }
        
        .remove-btn:hover {
            background: #b91c1c;
        }
        /* =====================================================
           EMPTY CART
           ===================================================== */
        
        .empty-cart {
            text-align: center;
            padding: 60px 20px;
        }
        
        .empty-cart h2 {
            margin-bottom: 10px;
        }
        
        .empty-cart p {
            color: #777;
            margin-bottom: 20px;
        }
        /* =====================================================
           CART SUMMARY
           ===================================================== */
        
        .cart-summary {
            background: white;
            border: 1px solid #e5e5e5;
            border-radius: 14px;
            padding: 22px;
            position: sticky;
            top: 20px;
        }
        
        .cart-summary h2 {
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 22px;
        }
        /* SUMMARY ROW */
        
        .summary-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #eee;
            color: #555;
            font-size: 14px;
        }
        /* TOTAL */
        
        .summary-total {
            border-bottom: none;
            padding-top: 18px;
            font-size: 18px;
            font-weight: 700;
            color: #111;
        }
        /* CHECKOUT */
        
        .checkout-btn {
            width: 100%;
            border: none;
            background: #111;
            color: white;
            padding: 13px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 15px;
            transition: 0.2s;
        }
        
        .checkout-btn:hover {
            background: #333;
        }
        /* MESSAGE */
        
        #cartMessage {
            margin-top: 12px;
            text-align: center;
            font-size: 13px;
        }
        /* =====================================================
           IMAGE FALLBACK
           ===================================================== */
        
        .cart-no-image {
            width: 120px;
            height: 110px;
            border-radius: 10px;
            background: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            flex-shrink: 0;
        }
        /* =====================================================
           RESPONSIVE
           ===================================================== */
        
        @media (max-width: 900px) {
            .cart-container {
                grid-template-columns: 1fr;
            }
            .cart-summary {
                position: static;
            }
        }
        
        @media (max-width: 600px) {
            .cart-page {
                padding: 15px;
            }
            .cart-item {
                align-items: flex-start;
                flex-wrap: wrap;
            }
            .cart-item-image {
                width: 100px;
                height: 90px;
            }
            .cart-item-details {
                min-width: 180px;
            }
        }
    </style>

</head>


<body>


    <!-- =====================================================
         APPLICATION SHELL
         ===================================================== -->

    <div id="app"></div>


    <!-- =====================================================
         SHOPPING CART
         ===================================================== -->

    <main class="page-content cart-page">


        <!-- =================================================
             CART HEADER
             ================================================= -->

        <div class="cart-header">

            <div>

                <h1>
                    🛒 Shopping Cart
                </h1>

                <p>
                    Review your selected products
                </p>

            </div>


            <a href="products.html" class="continue-btn">

                ← Continue Shopping

            </a>

        </div>


        <!-- =================================================
             CART CONTAINER
             ================================================= -->

        <div class="cart-container">


            <!-- =================================================
                 CART ITEMS
                 ================================================= -->

            <section class="cart-items">


                <!-- LOADING -->

                <div id="cartLoading">

                    Loading cart...

                </div>


                <!-- DYNAMIC CART ITEMS -->

                <div id="cartItems"></div>


                <!-- =================================================
                     EMPTY CART
                     ================================================= -->

                <div id="emptyCart" class="empty-cart" style="display:none;">

                    <h2>
                        Your cart is empty 🛒
                    </h2>

                    <p>
                        Add some products to your cart.
                    </p>

                    <a href="products.html" class="continue-btn">

                        Browse Products

                    </a>

                </div>

            </section>


            <!-- =================================================
                 ORDER SUMMARY
                 ================================================= -->

            <aside class="cart-summary">


                <h2>
                    Order Summary
                </h2>


                <!-- ITEMS -->

                <div class="summary-row">

                    <span>
                        Items
                    </span>

                    <span id="totalItems">
                        0
                    </span>

                </div>


                <!-- SUBTOTAL -->

                <div class="summary-row">

                    <span>
                        Subtotal
                    </span>

                    <span>
                        ₹<span id="subtotal">0.00</span>
                    </span>

                </div>


                <!-- DELIVERY -->

                <div class="summary-row">

                    <span>
                        Delivery
                    </span>

                    <span id="delivery">
                        Free
                    </span>

                </div>


                <!-- TOTAL -->

                <div class="summary-row summary-total">

                    <span>
                        Total
                    </span>

                    <span>
                        ₹<span id="grandTotal">0.00</span>
                    </span>

                </div>


                <!-- CHECKOUT -->

                <button id="checkoutBtn" class="checkout-btn" type="button" onclick="proceedToCheckout()">

                    Proceed to Checkout

                </button>


                <!-- MESSAGE -->

                <div id="cartMessage"></div>

            </aside>

        </div>

    </main>


    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script src="js/config.js"></script>

    <script src="js/app.js"></script>

    <script src="js/cart.js"></script>


</body>

</html>
