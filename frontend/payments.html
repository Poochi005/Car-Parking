<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Payments - Smart Car Parking</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Application Layout -->
    <div id="app"></div>


    <main class="page-content">

        <!-- PAGE HEADER -->
        <div class="page-head">

            <div>
                <h1>Payments</h1>

                <p class="muted">
                    Payment records and parking charges
                </p>
            </div>

        </div>


        <!-- =================================================
             MAKE PAYMENT
             ================================================= -->

        <div class="panel">

            <h2>Make Payment</h2>

            <form id="paymentForm">

                <!-- BOOKING ID -->

                <div class="form-group">

                    <label for="bookingId">
                        Booking ID
                    </label>

                    <input type="number" id="bookingId" placeholder="Enter booking ID" min="1" required>

                </div>


                <!-- AMOUNT -->

                <div class="form-group">

                    <label for="amount">
                        Amount
                    </label>

                    <input type="number" id="amount" placeholder="Enter amount" min="1" step="0.01" required>

                </div>


                <!-- PAYMENT METHOD -->

                <div class="form-group">

                    <label for="paymentMethod">
                        Payment Method
                    </label>

                    <select id="paymentMethod" required>

                        <option value="">
                            Select Payment Method
                        </option>

                        <option value="UPI">
                            UPI
                        </option>

                        <option value="CARD">
                            Credit / Debit Card
                        </option>

                        <option value="NET_BANKING">
                            Net Banking
                        </option>

                        <option value="CASH">
                            Cash
                        </option>

                    </select>

                </div>


                <!-- PAY BUTTON -->

                <button type="submit" class="btn-primary" id="payButton">
                    Pay Now
                </button>

            </form>


            <!-- MESSAGE -->

            <p id="paymentMessage" style="margin-top: 15px;"></p>

        </div>


        <!-- =================================================
             PAYMENT SUCCESS
             ================================================= -->

        <div class="panel" id="paymentSuccess" style="display: none;">

            <h2>
                Payment Successful ✅
            </h2>

            <p>
                Transaction ID:
                <strong id="transactionId"></strong>
            </p>

            <p>
                Payment Status:
                <strong id="paymentStatus"></strong>
            </p>

            <p>
                Amount: ₹
                <strong id="paidAmount"></strong>
            </p>

        </div>


        <!-- =================================================
             PAYMENT RECORDS
             ================================================= -->

        <div class="panel">

            <h2>
                Payment Records
            </h2>


            <div id="paymentLoading">
                Loading payments...
            </div>


            <div id="paymentRecords"></div>

        </div>

    </main>


    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
    <script src="js/payments.js"></script>

</body>

</html>
