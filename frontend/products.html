<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Products - Smart Car Parking</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        /* =====================================================
           PRODUCTS PAGE
           ===================================================== */
        
        .products-page {
            padding: 25px;
        }
        
        .products-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        
        .products-header h1 {
            margin: 0;
            font-size: 30px;
        }
        
        .products-header p {
            margin: 6px 0 0;
            color: #777;
        }
        /* SEARCH */
        
        .product-search {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .product-search input {
            width: 280px;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
            background: #fff;
        }
        
        .product-search input:focus {
            border-color: #111;
        }
        /* COUNT */
        
        .product-count {
            margin-bottom: 20px;
            color: #666;
            font-size: 14px;
        }
        /* =====================================================
           PRODUCT GRID
           ===================================================== */
        
        .products-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 22px;
        }
        /* =====================================================
           PRODUCT CARD
           ===================================================== */
        
        .product-card {
            background: #fff;
            border: 1px solid #e5e5e5;
            border-radius: 14px;
            overflow: hidden;
            transition: all 0.3s ease;
            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.05);
        }
        
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
        }
        /* =====================================================
           PRODUCT IMAGE
           ===================================================== */
        
        .product-image {
            width: 100%;
            height: 210px;
            background: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        
        .product-image img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }
        
        .product-card:hover .product-image img {
            transform: scale(1.05);
        }
        /* NO IMAGE */
        
        .no-image {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 45px;
            color: #999;
        }
        
        .no-image span {
            font-size: 13px;
            color: #888;
        }
        /* =====================================================
           PRODUCT INFO
           ===================================================== */
        
        .product-info {
            padding: 18px;
        }
        
        .product-category {
            display: inline-block;
            background: #f0f0f0;
            color: #555;
            padding: 5px 9px;
            border-radius: 5px;
            font-size: 11px;
            margin-bottom: 10px;
        }
        
        .product-name {
            font-size: 18px;
            font-weight: 600;
            margin: 0 0 8px;
            color: #222;
        }
        
        .product-description {
            color: #777;
            font-size: 13px;
            line-height: 1.5;
            min-height: 40px;
            margin-bottom: 12px;
        }
        /* PRICE */
        
        .product-price {
            font-size: 21px;
            font-weight: 700;
            color: #111;
            margin-bottom: 8px;
        }
        /* STOCK */
        
        .product-stock {
            font-size: 13px;
            margin-bottom: 14px;
        }
        
        .stock-available {
            color: #16803c;
        }
        
        .stock-low {
            color: #d97706;
        }
        
        .stock-out {
            color: #dc2626;
        }
        /* =====================================================
           ACTION BUTTONS
           ===================================================== */
        
        .product-actions {
            display: flex;
            gap: 8px;
        }
        
        .btn-cart {
            flex: 1;
            border: none;
            background: #111;
            color: white;
            padding: 11px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
        }
        
        .btn-cart:hover {
            background: #333;
        }
        
        .btn-cart:disabled {
            background: #aaa;
            cursor: not-allowed;
        }
        
        .btn-view {
            padding: 11px 14px;
            border: 1px solid #ddd;
            background: white;
            color: #222;
            border-radius: 7px;
            cursor: pointer;
            font-weight: 500;
        }
        
        .btn-view:hover {
            background: #f5f5f5;
        }
        /* =====================================================
           LOADING
           ===================================================== */
        
        .products-loading {
            text-align: center;
            padding: 50px;
            color: #777;
            font-size: 16px;
        }
        /* =====================================================
           EMPTY
           ===================================================== */
        
        .products-empty {
            text-align: center;
            padding: 60px 20px;
            background: white;
            border-radius: 12px;
            border: 1px solid #eee;
        }
        
        .products-empty .icon {
            font-size: 50px;
            margin-bottom: 15px;
        }
        
        .products-empty h3 {
            margin-bottom: 8px;
        }
        
        .products-empty p {
            color: #777;
        }
        /* =====================================================
           MESSAGE
           ===================================================== */
        
        #productMessage {
            position: fixed;
            top: 80px;
            right: 25px;
            background: #111;
            color: white;
            padding: 14px 20px;
            border-radius: 8px;
            display: none;
            z-index: 99999;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
        }
        /* =====================================================
           PRODUCT MODAL
           ===================================================== */
        
        .product-modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.65);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 99998;
            padding: 20px;
        }
        
        .product-modal-box {
            width: 100%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            background: white;
            border-radius: 15px;
            padding: 25px;
            position: relative;
            box-shadow: 0 15px 50px rgba(0, 0, 0, 0.25);
        }
        /* CLOSE */
        
        .modal-close {
            position: absolute;
            right: 15px;
            top: 12px;
            width: 38px;
            height: 38px;
            border: none;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            font-size: 28px;
            line-height: 30px;
            cursor: pointer;
            z-index: 5;
        }
        
        .modal-close:hover {
            background: #eee;
        }
        /* MODAL IMAGE */
        
        .modal-image {
            width: 100%;
            height: 300px;
            background: #f5f5f5;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .modal-image img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
        }
        
        .modal-image .no-image {
            width: 100%;
            height: 100%;
        }
        /* MODAL CONTENT */
        
        .modal-category {
            color: #777;
            font-size: 13px;
            margin-bottom: 5px;
        }
        
        .modal-title {
            font-size: 25px;
            margin: 8px 0;
        }
        
        .modal-description {
            color: #666;
            line-height: 1.6;
            margin-bottom: 10px;
        }
        
        .modal-price {
            font-size: 25px;
            font-weight: bold;
            margin: 15px 0;
        }
        /* MODAL CART */
        
        #modalCartButton {
            width: 100%;
            margin-top: 15px;
        }
        /* =====================================================
           RESPONSIVE
           ===================================================== */
        
        @media (max-width: 1100px) {
            .products-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }
        
        @media (max-width: 800px) {
            .products-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .product-search input {
                width: 220px;
            }
        }
        
        @media (max-width: 550px) {
            .products-page {
                padding: 15px;
            }
            .products-grid {
                grid-template-columns: 1fr;
            }
            .products-header {
                align-items: flex-start;
            }
            .product-search {
                width: 100%;
            }
            .product-search input {
                width: 100%;
            }
            .modal-image {
                height: 220px;
            }
        }
    </style>

</head>


<body>

    <!-- =====================================================
         APP SHELL
         ===================================================== -->

    <div id="app"></div>


    <!-- =====================================================
         PRODUCTS CONTENT
         ===================================================== -->

    <main class="page-content">

        <div class="products-page">


            <!-- HEADER -->

            <div class="products-header">

                <div>

                    <h1>
                        🛒 Products
                    </h1>

                    <p>
                        Car accessories and smart vehicle products
                    </p>

                </div>


                <!-- SEARCH -->

                <div class="product-search">

                    <input type="text" id="productSearch" placeholder="Search products..." autocomplete="off">

                </div>

            </div>


            <!-- COUNT -->

            <div class="product-count" id="productCount">

                Loading products...

            </div>


            <!-- LOADING -->

            <div class="products-loading" id="productsLoading">

                Loading products...

            </div>


            <!-- PRODUCT GRID -->

            <div class="products-grid" id="productsGrid">
            </div>


            <!-- EMPTY -->

            <div class="products-empty" id="productsEmpty" style="display:none;">

                <div class="icon">
                    🔍
                </div>

                <h3>
                    No Products Found
                </h3>

                <p>
                    No products match your search.
                </p>

            </div>

        </div>

    </main>


    <!-- =====================================================
         MESSAGE
         ===================================================== -->

    <div id="productMessage"></div>


    <!-- =====================================================
         PRODUCT DETAILS MODAL
         ===================================================== -->

    <div class="product-modal" id="productModal">

        <div class="product-modal-box">


            <!-- CLOSE -->

            <button class="modal-close" type="button" onclick="closeProductModal()">

                ×

            </button>


            <!-- IMAGE -->

            <div class="modal-image" id="modalImage">

            </div>


            <!-- CATEGORY -->

            <div class="modal-category" id="modalCategory">

            </div>


            <!-- TITLE -->

            <h2 class="modal-title" id="modalTitle">

            </h2>


            <!-- DESCRIPTION -->

            <p class="modal-description" id="modalDescription">

            </p>


            <!-- PRICE -->

            <div class="modal-price" id="modalPrice">

            </div>


            <!-- STOCK -->

            <p id="modalStock">

            </p>


            <!-- CART -->

            <button class="btn-cart" id="modalCartButton" type="button">

                Add to Cart

            </button>

        </div>

    </div>


    <!-- =====================================================
         CONFIG
         ===================================================== -->

    <script src="js/config.js"></script>


    <!-- =====================================================
         APP
         ===================================================== -->

    <script src="js/app.js"></script>


    <!-- =====================================================
         PRODUCTS JS
         ===================================================== -->

    <script src="js/products.js"></script>


</body>

</html>
