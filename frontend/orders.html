<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Orders - Smart Car Parking</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        /* ================================
           ORDERS PAGE
           ================================ */
        
        .orders-page {
            padding: 30px;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .orders-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 25px;
        }
        
        .orders-header h1 {
            margin: 0;
            font-size: 30px;
        }
        
        .orders-header p {
            margin: 6px 0 0;
            color: #777;
        }
        
        .orders-actions {
            display: flex;
            gap: 10px;
        }
        
        .order-btn {
            border: none;
            padding: 11px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
        }
        
        .order-btn-primary {
            background: #2563eb;
            color: white;
        }
        
        .order-btn-primary:hover {
            background: #1d4ed8;
        }
        
        .order-btn-secondary {
            background: #f1f5f9;
            color: #333;
        }
        
        .order-btn-secondary:hover {
            background: #e2e8f0;
        }
        /* Stats */
        
        .order-stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
            margin-bottom: 25px;
        }
        
        .order-stat {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.08);
        }
        
        .order-stat-label {
            color: #777;
            font-size: 14px;
            margin-bottom: 8px;
        }
        
        .order-stat-value {
            font-size: 25px;
            font-weight: 700;
        }
        /* Filter */
        
        .orders-filter {
            background: white;
            padding: 18px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.06);
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }
        
        .orders-filter label {
            font-weight: 600;
        }
        
        .orders-filter select,
        .orders-filter input {
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 7px;
            outline: none;
        }
        
        .orders-filter input {
            flex: 1;
            min-width: 200px;
        }
        /* Loading */
        
        .orders-loading {
            text-align: center;
            padding: 50px;
            color: #777;
        }
        /* Empty */
        
        .orders-empty {
            background: white;
            padding: 60px 20px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.06);
        }
        
        .orders-empty-icon {
            font-size: 55px;
            margin-bottom: 15px;
        }
        
        .orders-empty h2 {
            margin-bottom: 8px;
        }
        
        .orders-empty p {
            color: #777;
            margin-bottom: 20px;
        }
        /* Order Card */
        
        .orders-list {
            display: flex;
            flex-direction: column;
            gap: 18px;
        }
        
        .order-card {
            background: white;
            border-radius: 14px;
            padding: 22px;
            box-shadow: 0 3px 15px rgba(0, 0, 0, 0.08);
        }
        
        .order-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }
        
        .order-number {
            font-size: 19px;
            font-weight: 700;
        }
        
        .order-date {
            color: #777;
            font-size: 13px;
            margin-top: 5px;
        }
        /* Status */
        
        .status-badge {
            display: inline-block;
            padding: 7px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
        }
        
        .status-placed {
            background: #dbeafe;
            color: #1d4ed8;
        }
        
        .status-confirmed {
            background: #dcfce7;
            color: #15803d;
        }
        
        .status-preparing {
            background: #fef3c7;
            color: #b45309;
        }
        
        .status-out-for-delivery {
            background: #ede9fe;
            color: #6d28d9;
        }
        
        .status-delivered {
            background: #dcfce7;
            color: #166534;
        }
        
        .status-cancelled {
            background: #fee2e2;
            color: #b91c1c;
        }
        /* Order Details */
        
        .order-details {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
            padding: 18px 0;
        }
        
        .order-detail-label {
            color: #888;
            font-size: 12px;
            margin-bottom: 5px;
        }
        
        .order-detail-value {
            font-weight: 600;
            word-break: break-word;
        }
        
        .order-total {
            font-size: 20px;
            color: #16a34a;
        }
        /* Delivery */
        
        .order-delivery {
            background: #f8fafc;
            border-radius: 9px;
            padding: 15px;
            margin-top: 5px;
        }
        
        .order-delivery-title {
            font-weight: 700;
            margin-bottom: 7px;
        }
        
        .order-delivery-text {
            color: #555;
            line-height: 1.6;
        }
        /* Bottom */
        
        .order-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            padding-top: 15px;
            margin-top: 15px;
            border-top: 1px solid #eee;
        }
        
        .payment-info {
            font-size: 13px;
            color: #666;
        }
        
        .payment-success {
            color: #15803d;
            font-weight: 700;
        }
        
        .payment-pending {
            color: #b45309;
            font-weight: 700;
        }
        
        .order-error {
            background: #fee2e2;
            color: #b91c1c;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
        /* Responsive */
        
        @media (max-width: 900px) {
            .order-stats {
                grid-template-columns: repeat(2, 1fr);
            }
            .order-details {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        
        @media (max-width: 600px) {
            .orders-page {
                padding: 15px;
            }
            .orders-header {
                flex-direction: column;
                align-items: flex-start;
            }
            .orders-actions {
                width: 100%;
            }
            .orders-actions a {
                flex: 1;
                text-align: center;
            }
            .order-stats {
                grid-template-columns: 1fr;
            }
            .order-details {
                grid-template-columns: 1fr;
            }
            .order-top {
                flex-direction: column;
                align-items: flex-start;
            }
            .order-bottom {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>

    <!-- Common App Shell -->
    <div id="app"></div>

    <!-- Orders Content -->
    <main class="page-content">

        <div class="orders-page">

            <!-- Header -->
            <div class="orders-header">

                <div>
                    <h1>📦 My Orders</h1>
                    <p>View your complete order history</p>
                </div>

                <div class="orders-actions">
                    <a href="products.html" class="order-btn order-btn-secondary">
                        🛍️ Products
                    </a>

                    <a href="cart.html" class="order-btn order-btn-primary">
                        🛒 Cart
                    </a>
                </div>

            </div>

            <!-- Error -->
            <div id="ordersError" class="order-error"></div>

            <!-- Stats -->
            <div class="order-stats">

                <div class="order-stat">
                    <div class="order-stat-label">
                        Total Orders
                    </div>

                    <div class="order-stat-value" id="totalOrders">
                        0
                    </div>
                </div>

                <div class="order-stat">
                    <div class="order-stat-label">
                        Active Orders
                    </div>

                    <div class="order-stat-value" id="activeOrders">
                        0
                    </div>
                </div>

                <div class="order-stat">
                    <div class="order-stat-label">
                        Delivered
                    </div>

                    <div class="order-stat-value" id="deliveredOrders">
                        0
                    </div>
                </div>

                <div class="order-stat">
                    <div class="order-stat-label">
                        Total Spent
                    </div>

                    <div class="order-stat-value">
                        ₹<span id="totalSpent">0.00</span>
                    </div>
                </div>

            </div>

            <!-- Filter -->
            <div class="orders-filter">

                <label for="orderStatusFilter">
                    Status:
                </label>

                <select id="orderStatusFilter">

                    <option value="ALL">
                        All Orders
                    </option>

                    <option value="PLACED">
                        Placed
                    </option>

                    <option value="CONFIRMED">
                        Confirmed
                    </option>

                    <option value="PREPARING">
                        Preparing
                    </option>

                    <option value="OUT_FOR_DELIVERY">
                        Out for Delivery
                    </option>

                    <option value="DELIVERED">
                        Delivered
                    </option>

                    <option value="CANCELLED">
                        Cancelled
                    </option>

                </select>

                <input type="text" id="orderSearch" placeholder="Search order number...">

            </div>

            <!-- Loading -->
            <div id="ordersLoading" class="orders-loading">
                Loading your orders...
            </div>

            <!-- Empty -->
            <div id="ordersEmpty" class="orders-empty" style="display:none;">

                <div class="orders-empty-icon">
                    📦
                </div>

                <h2>No Orders Found</h2>

                <p>
                    You haven't placed any orders yet.
                </p>

                <a href="products.html" class="order-btn order-btn-primary">
                    Start Shopping
                </a>

            </div>

            <!-- Orders -->
            <div id="ordersList" class="orders-list">
            </div>

        </div>

    </main>

    <!-- Scripts -->
    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
    <script src="js/orders.js"></script>

</body>

</html>
